# Monthly update suggestions as pull requests (each one runs the CI first);
# security updates still arrive immediately.
# Minor and patch updates are grouped per ecosystem to keep the noise down;
# major updates come one by one, since they may need code changes.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: monthly
    groups:
      python-minor:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /dashboard
    schedule:
      interval: monthly
    groups:
      npm-minor:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /dashboard
    schedule:
      interval: monthly
