server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Backend API — reverse proxy onto the compose network.
    # Docker's embedded DNS (127.0.0.11) is used via a variable so nginx still
    # starts when the backend is briefly down and re-resolves its IP after
    # container restarts.
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $ccu_backend "backend:8000";
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$ccu_backend;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-Sent Events (backend /events not wired yet, kept ready)
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # hashed assets are safe to cache forever
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }

    # never cache the entry point – it points at the current hashed bundles
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
